<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du Lịch Việt Nam - Hành Trình Khám Phá Di Sản</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Khám Phá Du Lịch Việt Nam</h1>
        <p>Thưởng thức nét đẹp thiên nhiên kỳ vĩ và di sản văn hóa lâu đời của đất nước qua từng điểm đến nổi tiếng.</p>
    </header>

    <main class="grid-container">
        <figure>
            <img src="images/ha-long.jpg" alt="Vịnh Hạ Long với hàng ngàn đảo đá vôi kỳ vĩ trên làn nước xanh ngọc">
            <figcaption>
                <h2>1. Vịnh Hạ Long</h2>
                <p>Vịnh Hạ Long là kỳ quan thiên nhiên thế giới nổi tiếng với hàng ngàn đảo đá vôi hùng vĩ và làn nước xanh ngọc bích đượm đà nét đẹp Quảng Ninh.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/ha-noi.png" alt="Phố cổ Hà Nội bình yên vào buổi sáng sớm với nét đẹp cổ kính">
            <figcaption>
                <h2>2. Thủ Đô Hà Nội</h2>
                <p>Mảnh đất ngàn năm văn hiến với những con phố cổ trầm mặc, Hồ Gươm bình yên và nét văn hóa lâu đời ấm áp giữa lòng thủ đô.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/hcm.jpg" alt="Thành phố Hồ Chí Minh lung linh hiện đại về đêm">
            <figcaption>
                <h2>3. TP. Hồ Chí Minh</h2>
                <p>Trái tim kinh tế sôi động nhất Việt Nam với những tòa nhà cao tầng hiện đại, nhịp sống nhộn nhịp cùng ẩm thực đường phố phong phú.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/hoi-an.jpg" alt="Phố cổ Hội An rực rỡ sắc màu với những ngọn đèn lồng lung linh">
            <figcaption>
                <h2>4. Phố Cổ Hội An</h2>
                <p>Di sản văn hóa thế giới bình yên bên dòng sông Hoài, nổi tiếng với những ngôi nhà cổ vàng óng và ánh đèn lồng rực rỡ về đêm.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/da-nang.jpg" alt="Cầu Rồng Đà Nẵng phun lửa nổi tiếng bắc qua sông Hàn">
            <figcaption>
                <h2>5. Thành Phố Đà Nẵng</h2>
                <p>Thành phố biển đáng sống nhất Việt Nam với Cầu Rồng độc đáo, bãi biển Mỹ Khê xanh mát và Bà Nà Hills tuyệt đẹp.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/ninh-binh.jpg" alt="Ninh Bình với những dòng sông uốn lượn quanh dãy núi đá vôi">
            <figcaption>
                <h2>6. Quần Thể Ninh Bình</h2>
                <p>Vùng đất được mệnh danh là Hạ Long trên cạn với cảnh sắc sơn thủy hữu tình, Tràng An kỳ vĩ và Cố đô Hoa Lư cổ kính.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="images/hue.jpg" alt="Cố đô Huế trầm mặc bên dòng sông Hương mộng mơ">
            <figcaption>
                <h2>7. Cố Đồ Huế</h2>
                <p>Vùng đất di sản đậm đà bản sắc lịch sử với Đại Nội cổ kính, các lăng tẩm triều Nguyễn và dòng sông Hương mộng mơ.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; Du Lịch Việt Nam.</p>
    </footer>
</body>
</html>
